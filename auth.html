<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — TechMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Общие */
    *,*::before,*::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #111;
      background: url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat fixed;
      display: grid;
      place-items: center;
    }
    /* Карточка формы */
    .card {
      width: min(420px, 92vw);
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
      border: 1px solid rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 6px; font-size: 26px; }
    p { margin: 0 0 16px; color: #444; }
    .row { display: flex; flex-direction: column; margin-bottom: 12px; }
    label { font-weight: 600; margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      font: inherit; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #d1d5db; outline: none;
      transition: border-color .2s, box-shadow .2s;
      background: #fff;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    .remember { display: flex; align-items: center; gap: 10px; margin: 8px 0 12px; }
    .btn {
      display: inline-block; width: 100%;
      background: #2563eb; color: #fff; text-decoration: none;
      padding: 12px 16px; border-radius: 12px; font-weight: 700; border: 0; cursor: pointer;
      transition: opacity .2s, transform .06s;
    }
    .btn:hover { opacity: .92; }
    .btn:active { transform: translateY(1px); }
    .links { margin-top: 10px; text-align: center; }
    .links a { color: #2563eb; text-decoration: none; }
    .links a:hover { color: #1e40af; }
  </style>
</head>
<body>
  <form class="card" action="https://httpbin.org/post" method="POST">
    <h1>Вход в TechMarket</h1>
    <p>Введите логин и пароль, чтобы продолжить.</p>
    <div class="row">
      <label for="login">Логин</label>
      <input type="text" id="login" name="login" required placeholder="yourname" />
    </div>
    <div class="row">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" required placeholder="••••••••" />
    </div>
    <label class="remember">
      <input type="checkbox" name="remember" value="yes" />
      Запомнить меня
    </label>
    <button type="submit" class="btn">Войти</button>
    <div class="links">
      <a href="index.html">← На главную</a>
    </div>
  </form>
</body>
</html>
